<li class="pub">
  <span class="pub-year">{{ pub.year }}</span>
  <div>
    <h3><a href="{{ pub.url }}">{{ pub.title }}</a></h3>
    <p class="pub-authors">{{ pub.authors_html }}</p>
    <p class="pub-journal">{{ pub.journal }}{% if pub.type == 'preprint' %} <span class="tag">Preprint</span>{% endif %}</p>
    {% if pub.note %}<p class="pub-note">{{ pub.note }}</p>{% endif %}
  </div>
</li>
